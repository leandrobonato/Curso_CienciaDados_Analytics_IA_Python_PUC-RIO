<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabuleiro</title>
        <link rel="stylesheet" type="" href="css/styles.css"> 
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="" crossorigin="anonymous">
        <script src="javascript/tabuleiro.js"></script>
    </head>
    <body>
        <header id="header-tabuleiro"> 
            <div class="previousPage">
                <a href="regras.html" class="circulo">
                    <img src="images/arrow-up.png" alt="regras" class="arrow">
                </a> 
            </div>
        </header>
        <section class="tabuleiro" id="tabuleiro">
            <div class="nivel" id="nivel">Nível 1</div>
            <div class="gramado" id="gramado"> 
                <img src="images/hole.png" alt="buraco" id="buraco0" class="hole">
                <img src="images/hole.png" alt="buraco" id="buraco1" class="hole">
                <img src="images/hole.png" alt="buraco" id="buraco2" class="hole">
                <img src="images/hole.png" alt="buraco" id="buraco3" class="hole">
                <img src="images/hole.png" alt="buraco" id="buraco4" class="hole"> 
            </div>
            <div class="pontuacao">
                <table border="0">  
                    <thead>
                        <tr>
                            <th class="cab_pontuacao" colspan="2">Pontuação</thead>
                        </tr>
                    </thead>   
                    <tbody class="pontuacao_conteudo">
                        <tr class="pontuacao_acertos">
                            <td>Acertos:</td>
                            <td id="acertos">
                                <img id="acertos_centena" src="images/caractere_0.gif" alt="acertos">
                                <img id="acertos_dezena" src="images/caractere_0.gif" alt="acertos">
                                <img id="acertos_unidade" src="images/caractere_0.gif" alt="acertos">
                            </td> 
                        </tr>
                        <tr class="pontuacao_perdidos">
                            <td>Perdidos:</td>
                            <td id="perdidos">
                                <img id="perdidos_centena" src="images/caractere_0.gif" alt="perdas">
                                <img id="perdidos_dezena" src="images/caractere_0.gif" alt="perdas">
                                <img id="perdidos_unidade" src="images/caractere_0.gif" alt="perdas">
                            </td> 
                        </tr class="pontuacao_errados">
                            <td>Errados:</td>
                            <td id="errados">
                                <img id="errados_centena" src="images/caractere_0.gif" alt="erros">
                                <img id="errados_dezena" src="images/caractere_0.gif" alt="erros">
                                <img id="errados_unidade" src="images/caractere_0.gif" alt="erros">
                            </td>                        
                        <tr class="pontuacao_saldo">
                            <td>Saldo:</td>
                            <td id="saldo">
                                <img id="saldo_centena" src="images/caractere_0.gif" alt="saldo">
                                <img id="saldo_dezena" src="images/caractere_0.gif" alt="saldo">
                                <img id="saldo_unidade" src="images/caractere_0.gif" alt="saldo">
                            </td>                        
                        </tr>
                        <tr class="botao_start">
                            <td  colspan="2" > 
                                <button class="btn btn-light" type="button" name="btnStart" id="btnStart">Iniciar</button>                                
                            </td>
                        </tr>
                    </tbody>                                
                </table>
            </div>
        </section>
        <footer id="footer-tabuleiro">
            <div class="nextPage">
                <a href="recordes.html#header-recordes" class="circulo">
                    <img src="images/arrow-down.png" alt="recordes" class="arrow">
                </a>
            </div>
        </footer>
    </body>
</html>
